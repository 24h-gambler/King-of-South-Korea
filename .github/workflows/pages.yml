name: Deploy to GitHub Pages

# 정적 사이트를 GitHub Pages로 자동 배포합니다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정하면 동작합니다.

on:
  push:
    branches: ["main", "claude/korean-president-simulator-xbbxc0"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
